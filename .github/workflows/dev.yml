name: CD - Deploy to DEV

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de imagen (DEV)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hola-mundo:dev

      - name: Despliegue en AWS EC2 DEV vía SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Descargar la última imagen del ambiente dev
            docker pull ${{ secrets.DOCKER_USERNAME }}/hola-mundo:dev
            # Detener y eliminar el contenedor anterior si existe
            docker stop app-dev || true
            docker rm app-dev || true
            # Iniciar el nuevo contenedor en el puerto 80
            docker run -d --name app-dev -p 80:80 ${{ secrets.DOCKER_USERNAME }}/hola-mundo:dev
            # Limpiar imágenes antiguas para ahorrar espacio
            docker image prune -f